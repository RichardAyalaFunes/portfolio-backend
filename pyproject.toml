[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Richard",email = "ayala.funes06@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "websockets (>=16.0,<17.0)",
    "openai (>=1.50.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[tool.fastapi]
entrypoint = "backend.infrastructure.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
